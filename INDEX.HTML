<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار اللغة الإنجليزية الشامل 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent: #06B6D4;
            --correct: #10B981;
            --incorrect: #EF4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        .screen {
            padding: 30px;
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Cover Screen */
        #cover-screen {
            text-align: center;
            padding: 50px 20px;
        }

        .badge {
            background: rgba(79, 70, 229, 0.2);
            color: #818CF8;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            font-weight: 800;
            line-height: 1.3;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 35px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .info-card .val {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
        }

        .info-card .lbl {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            width: 100%;
            max-width: 300px;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        /* Quiz Header */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .progress-container {
            width: 60%;
            background: var(--bg);
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s ease;
        }

        .q-counter {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* Question Box */
        .q-text {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
            color: #FFFFFF;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            direction: ltr;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .option-btn.selected {
            border-color: var(--accent);
            background: rgba(6, 182, 212, 0.1);
        }

        .quiz-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn-nav {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-nav:hover {
            background: var(--border);
        }

        .btn-next {
            background: var(--primary);
            border: none;
            color: white;
        }

        .btn-next:hover {
            background: var(--primary-hover);
        }

        /* Result Screen */
        .result-box {
            text-align: center;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--card-bg) 60%, transparent 61%),
                        conic-gradient(var(--accent) 0%, var(--border) 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            position: relative;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        .score-val {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .review-section {
            margin-top: 35px;
            text-align: right;
            max-height: 400px;
            overflow-y: auto;
            padding-left: 10px;
        }

        .review-section::-webkit-scrollbar {
            width: 6px;
        }
        .review-section::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .review-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            direction: ltr;
            text-align: left;
        }

        .review-card.wrong {
            border-left: 4px solid var(--incorrect);
        }

        .review-card.right {
            border-left: 4px solid var(--correct);
        }

        .review-q {
            font-weight: 700;
            margin-bottom: 10px;
            color: #FFFFFF;
        }

        .review-ans {
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .text-correct { color: var(--correct); }
        .text-incorrect { color: var(--incorrect); }

        @media (max-width: 600px) {
            .screen { padding: 20px 15px; }
            h1 { font-size: 1.7rem; }
            .q-text { font-size: 1.1rem; }
            .option-btn { padding: 12px 15px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Cover Screen -->
    <div id="cover-screen" class="screen active">
        <span class="badge">النموذج التقيمي المعياري 2026</span>
        <h1>اختبار اللغة الإنجليزية الشامل</h1>
        <p class="subtitle">اختبر حصيلتك اللغوية والقواعدية عبر 50 سؤالاً متكاملاً تم اختيارها بعناية لقياس مستواك الدقيق.</p>
        
        <div class="info-cards">
            <div class="info-card">
                <div class="val">50</div>
                <div class="lbl">عدد الأسئلة</div>
            </div>
            <div class="info-card">
                <div class="val">100</div>
                <div class="lbl">الدرجة الكلية</div>
            </div>
            <div class="info-card">
                <div class="val">2 علامة</div>
                <div class="lbl">لكل سؤال</div>
            </div>
        </div>

        <button class="btn-start" onclick="startQuiz()">ابدأ الاختبار الآن</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-header">
            <span class="q-counter" id="q-counter">سؤال 1 من 50</span>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="q-text" id="q-text"></div>
        <div class="options-grid" id="options-container"></div>

        <div class="quiz-footer">
            <button class="btn-nav" id="btn-prev" onclick="prevQuestion()" style="visibility: hidden;">السابق</button>
            <button class="btn-nav btn-next" id="btn-next" onclick="nextQuestion()">التالي</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
        <div class="result-box">
            <h2>نتيجة الاختبار</h2>
            <div class="score-circle" id="score-circle">
                <span class="score-val" id="score-text">0%</span>
            </div>
            <p id="result-message" class="subtitle" style="margin-bottom: 20px;"></p>

            <button class="btn-start" onclick="restartQuiz()" style="margin-bottom: 20px;">إعادة الاختبار</button>

            <h3 style="text-align: right; margin-bottom: 15px; border-top: 1px solid var(--border); padding-top: 20px;">
                مراجعة التفاصيل والأنشطة:
            </h3>
            <div class="review-section" id="review-container"></div>
        </div>
    </div>
</div>

<script>
const quizData = [
    { q: "1- Choose the compound adjective that is composed of a noun + adjective.", options: ["a) world-famous", "b) red-hot", "c) strong-willed", "d) underconfident"], answer: 0 },
    { q: "2- Replace the underlined adjective with the correct one: A good leader must be defensive so people can rely on him.", options: ["a) underconfident", "b) enthusiastic", "c) compassionate", "d) trustworthy"], answer: 3 },
    { q: "3- She’s had a very difficult year, but she’s ____________ and ____________, so she has what it takes to get through it.", options: ["a) resilient / tough", "b) compassionate / defensive", "c) capable / underconfident", "d) enthusiastic / self-aware"], answer: 0 },
    { q: "4- Hamza is very ____________ and ____________ – he always knows what to do and he keeps his promises.", options: ["a) compassionate / passionate", "b) capable / trustworthy", "c) tough / defensive", "d) resilient / underconfident"], answer: 1 },
    { q: "5- The adjective “red-hot” is composed of:", options: ["a) adverb + past participle", "b) adjective + adjective", "c) adjective + gerund", "d) noun + past participle"], answer: 1 },
    { q: "6- Every time we eat out, he always tries to avoid paying his share. He's so ____________!", options: ["a) laid-back", "b) kind-hearted", "c) high-spirited", "d) tight-fisted"], answer: 3 },
    { q: "7- I’m so ____________ I can’t find my glasses even when they’re on top of my head!", options: ["a) tight-fisted", "b) absent-minded", "c) good-looking", "d) world-famous"], answer: 1 },
    { q: "8- Be careful what you say to her. She’s really _______________ and can’t take criticism at all.", options: ["a) thin-skinned", "b) strong-willed", "c) kind-hearted", "d) red-hot"], answer: 0 },
    { q: "9- Replace the underlined adjective with the correct one: This business is stuck in the past. They need a more highly strung approach.", options: ["a) absent-minded", "b) forward-looking", "c) like-minded", "d) kind-hearted"], answer: 1 },
    { q: "10- One of the following nouns means: “devoting time and energy to something.”", options: ["a) humility", "b) spontaneity", "c) discretion", "d) commitment"], answer: 3 },
    { q: "11- ____________ is the quality of living in the moment and not planning.", options: ["a) spontaneity", "b) commitment", "c) humility", "d) mercy"], answer: 0 },
    { q: "12- ____________ is the ability to give feedback without upsetting anyone.", options: ["a) humility", "b) inclusiveness", "c) spontaneity", "d) tactfulness"], answer: 3 },
    { q: "13- The government advises against travel until the political situation is more ____________.", options: ["a) frank", "b) stable", "c) merciful", "d) passionate"], answer: 1 },
    { q: "14- With difficulty, he managed to ______ what she was trying to explain.", options: ["a) capable", "b) assume", "c) comprehend", "d) reflect"], answer: 2 },
    { q: "15- One of the following fixed expressions means: “Feel excitement and enjoyment”", options: ["a) get a kick out of", "b) plump for", "c) be not that into", "d) makes us tick"], answer: 0 },
    { q: "16- One of the following fixed expressions means: “Match with”", options: ["a) plump for", "b) get a kick out of", "c) say a lot about us", "d) be in line with"], answer: 3 },
    { q: "17- What does the underlined expression mean: “She isn’t that into horror movies.”", options: ["a) Be crazy about something", "b) Not be very keen on something", "c) Makes us behave in a certain way", "d) Consider something to be important"], answer: 1 },
    { q: "18- I _______________ her straightaway and we’ve been friends ever since.", options: ["a) plumped for", "b) got a kick out of", "c) clicked with", "d) say a lot about us"], answer: 2 },
    { q: "19- She sets great store _______ good table manners.", options: ["a) by", "b) with", "c) into", "d) out"], answer: 0 },
    { q: "20- I’m just not that _______ cooking, it’s too much effort.", options: ["a) into", "b) by", "c) with", "d) about"], answer: 0 },
    { q: "21- “Your results _______________ how hard you must have worked.”", options: ["a) say a lot about", "b) assume", "c) plump for", "d) makes us tick"], answer: 0 },
    { q: "22- “I’m just _______________ cooking, it’s too much effort.”", options: ["a) click with", "b) wild about", "c) in line with", "d) not that into"], answer: 3 },
    { q: "23- One of the following phrases means: “a person who keeps their abilities secret”", options: ["a) a social butterfly", "b) a soft touch", "c) a dark horse", "d) a mover and shaker"], answer: 2 },
    { q: "24- “a person who is determined to be successful” is …………………………………….", options: ["a) a go-getter", "b) a smart alec", "c) a cold fish", "d) a smart cookie"], answer: 0 },
    { q: "25- What does the underlined phrase mean: “She’s such a social butterfly. She loves parties and meeting new people.”", options: ["a) determined to be successful", "b) likes to attend social events", "c) tries to look clever in an annoying way", "d) doesn’t show their feelings"], answer: 1 },
    { q: "26- He never shows his emotions and seems very distant. He’s a ____________.", options: ["a) cold fish", "b) social butterfly", "c) soft touch", "d) smart cookie"], answer: 0 },
    { q: "27- One of the following words means: “What will happen in the future”", options: ["a) oversimplification", "b) hereditary", "c) proponents", "d) destiny"], answer: 3 },
    { q: "28- One of the following words means: “Suggest”", options: ["a) proponents", "b) moulded", "c) imply", "d) oversimplification"], answer: 2 },
    { q: "29- “Many illnesses can be (hereditary), passed from parent to child.”", options: ["a) Character or personality", "b) Passed from parent to child", "c) Helping something or somebody to develop", "d) People who publicly support an idea"], answer: 1 },
    { q: "30- Muneer studies hard and always has a quiet _______________ in class.", options: ["a) offspring", "b) disposition", "c) vulnerability", "d) trait"], answer: 1 },
    { q: "31- My family, community and beliefs have very much _____________ the person I am today.", options: ["a) moulded", "b) implied", "c) nurtured", "d) oversimplified"], answer: 0 },
    { q: "32- Choose the incorrect word: “Because you had lived in Brazil, I ________ you spoke Portuguese.”", options: ["a) concluded", "b) assumed", "c) grasped", "d) deduced"], answer: 2 },
    { q: "33- One of the following phrases is used to summarise:…………………………………", options: ["a) Essentially, …", "b) In other words …", "c) To put it another way …", "d) Let me get this straight …"], answer: 0 },
    { q: "34- He’s very ______ and never brags about how good he is at everything, despite his talents.", options: ["a) defensive", "b) humble", "c) tough", "d) enthusiastic"], answer: 1 },
    { q: "35- I simply can’t __________ why two sisters with the same parents have such different personalities.", options: ["a) conclude", "b) assume", "c) comprehend", "d) consider"], answer: 2 },
    { q: "36- He feels terrible because he __________ sweets all morning.", options: ["A) have been eating", "B) will be eating", "C) has been eating", "D) have eaten"], answer: 2 },
    { q: "37- How many glasses of water __________ by midday today?", options: ["A) had you drunk", "B) had you been drinking", "C) have you drunk", "D) were you drinking"], answer: 2 },
    { q: "38- Next time I see you, I will have had my hair cut short. It means:", options: ["A) a temporary situation", "B) a completed action in the future", "C) a recent action", "D) an action in the past"], answer: 1 },
    { q: "39- Since the days when we __________ in caves, the brain has prioritised survival.", options: ["A) had lived", "B) have been living", "C) were living", "D) are living"], answer: 2 },
    { q: "40- Don’t call me tonight. I __________ the next episode of Fix Up.", options: ["A) will have been watching", "B) was watching", "C) have been watching", "D) will be watching"], answer: 3 },
    { q: "41- When I finish the marathon, ---------------------------- 42 kilometres.", options: ["A) ran", "B) have run", "C) will have run", "D) will run"], answer: 2 },
    { q: "42- I --------------------------- a fantastic book before I went to sleep last night.", options: ["A) have been reading", "B) was reading", "C) had been read", "D) read"], answer: 1 },
    { q: "43- By the time you come and visit, I --------------------------- here for six months.", options: ["A) am living", "B) live", "C) will have been living", "D) will be living"], answer: 2 },
    { q: "44- While I ------------------------ here, I want to go for a walk every day.", options: ["A) am living", "B) live", "C) will live", "D) had lived"], answer: 0 },
    { q: "45- While she ………………. on her novel, she always drinks a cup of tea.", options: ["a) had worked", "b) work", "c) was working", "d) is working"], answer: 3 },
    { q: "46- I haven't seen my best friend………………… .", options: ["a) yesterday", "b) tomorrow", "c) nowadays", "d) for a long time"], answer: 3 },
    { q: "47- I had no idea what was happening.", options: ["a) I didn’t had a clue what was happening.", "b) I had a clue what was happening.", "c) I had had no clue what was happening.", "d) I had no clue what was happening."], answer: 3 },
    { q: "48- I took him with me everywhere I went.", options: ["a) No matter I took him with me where I went.", "b) Where I went, no matter I took him with me.", "c) No matter where I went, I took him with me.", "d) No where I went I took him with me matter."], answer: 2 },
    { q: "49- At 8 o'clock yesterday evening, I ________ TV while my brother was doing his homework.", options: ["A) watched", "B) was watching", "C) had watched", "D) am watching"], answer: 1 },
    { q: "50- I was nervous because I _____________________ never spoken in public before.", options: ["A) had", "B) have", "C) was", "D) did"], answer: 0 }
];

let currentQ = 0;
let userAnswers = new Array(quizData.length).fill(null);

function startQuiz() {
    document.getElementById('cover-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');
    loadQuestion();
}

function loadQuestion() {
    const qData = quizData[currentQ];
    document.getElementById('q-counter').innerText = `سؤال ${currentQ + 1} من ${quizData.length}`;
    document.getElementById('q-text').innerText = qData.q;
    
    const progress = ((currentQ + 1) / quizData.length) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (userAnswers[currentQ] === idx) btn.classList.add('selected');
        
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
    });

    document.getElementById('btn-prev').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
    document.getElementById('btn-next').innerText = currentQ === quizData.length - 1 ? 'إنهاء الاختبار' : 'التالي';
}

function selectOption(index) {
    userAnswers[currentQ] = index;
    const btns = document.querySelectorAll('.option-btn');
    btns.forEach((btn, idx) => {
        if (idx === index) btn.classList.add('selected');
        else btn.classList.remove('selected');
    });
}

function nextQuestion() {
    if (currentQ < quizData.length - 1) {
        currentQ++;
        loadQuestion();
    } else {
        showResult();
    }
}

function prevQuestion() {
    if (currentQ > 0) {
        currentQ--;
        loadQuestion();
    }
}

function showResult() {
    document.getElementById('quiz-screen').classList.remove('active');
    document.getElementById('result-screen').classList.add('active');

    let correctCount = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].answer) correctCount++;
    });

    const score = correctCount * 2;
    document.getElementById('score-text').innerText = `${score}%`;

    const circle = document.getElementById('score-circle');
    circle.style.background = `radial-gradient(circle, var(--card-bg) 60%, transparent 61%),
                conic-gradient(var(--accent) ${score}%, var(--border) ${score}%)`;

    const msg = document.getElementById('result-message');
    if (score >= 85) msg.innerText = "ممتاز! أداء استثنائي يدل على استيعاب قوي للقواعد والمفردات.";
    else if (score >= 70) msg.innerText = "أداء جيد جداً! لديك حصيلة جيدة مع بعض النقاط البسيطة للمراجعة.";
    else if (score >= 50) msg.innerText = "نتيجة مقبولة! تحتاج لبذل المزيد من الجهد والمراجعة لتعزيز مستواك.";
    else msg.innerText = "تحتاج إلى إعادة مراجعة القواعد والمفردات والتدرب بشكل أكبر.";

    // Render review items
    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    quizData.forEach((q, idx) => {
        const uAns = userAnswers[idx];
        const isCorrect = uAns === q.answer;

        const card = document.createElement('div');
        card.className = `review-card ${isCorrect ? 'right' : 'wrong'}`;

        let uText = uAns !== null ? q.options[uAns] : "لم يتم الإجابة";
        let cText = q.options[q.answer];

        card.innerHTML = `
            <div class="review-q">${q.q}</div>
            <div class="review-ans">إجابتك: <span class="${isCorrect ? 'text-correct' : 'text-incorrect'}">${uText}</span></div>
            ${!isCorrect ? `<div class="review-ans">الإجابة الصحيحة: <span class="text-correct">${cText}</span></div>` : ''}
        `;
        reviewContainer.appendChild(card);
    });
}

function restartQuiz() {
    currentQ = 0;
    userAnswers = new Array(quizData.length).fill(null);
    document.getElementById('result-screen').classList.remove('active');
    document.getElementById('cover-screen').classList.add('active');
}
</script>

</body>
</html>
